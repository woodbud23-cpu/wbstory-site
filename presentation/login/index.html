<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>木芽開發儲存空間 - 登入</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* 主登入卡片 */
    .login-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 頂部微型系統標題 */
    .system-title {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      font-weight: 600;
    }

    /* 表單欄位 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-label {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-left: 2px;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 18px;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s ease;
      letter-spacing: 3px;
    }

    .input-field::placeholder {
      color: #475569;
      letter-spacing: 4px;
    }

    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      background: rgba(15, 23, 42, 0.85);
    }

    /* 輸入錯誤時的震動與紅框效果 */
    .shake {
      animation: shake-anim 0.3s ease-in-out;
      border-color: #f43f5e !important;
    }

    @keyframes shake-anim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* 登入按鈕 */
    .submit-btn {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .error-hint {
      font-size: 14px;
      color: #f43f5e;
      text-align: center;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-weight: 500;
    }

    .error-hint.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 登入卡片 -->
  <div class="login-card">
    <div class="system-title">木芽開發儲存空間</div>

    <div class="form-group">
      <label class="form-label">帳號</label>
      <input type="text" id="accountInput" class="input-field" placeholder="••••••••" maxlength="8" autocomplete="off" />
    </div>

    <div class="form-group">
      <label class="form-label">密碼</label>
      <input type="password" id="passwordInput" class="input-field" placeholder="••••" maxlength="4" autocomplete="off" />
    </div>

    <div class="error-hint" id="errorHint">帳號或密碼錯誤</div>

    <button type="button" class="submit-btn" id="loginBtn">登入</button>
  </div>

  <script>
    // ==========================================
    // ⚙️ 串接接口設定區 (填入下一個網站網址)
    // ==========================================
    const TARGET_URL = "https://wbstory.site/presentation/harddrive/"; // 替換為你的 Google Slides 簡報或下一個關卡網址

    // 帳密設定
    const CORRECT_ACCOUNT = "20190706";
    const CORRECT_PASSWORD = "2239";

    // DOM 元素
    const accountInput = document.getElementById("accountInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const errorHint = document.getElementById("errorHint");

    // 登入驗證邏輯
    function handleLogin() {
      const inputAcc = accountInput.value.trim();
      const inputPwd = passwordInput.value.trim();

      if (inputAcc === CORRECT_ACCOUNT && inputPwd === CORRECT_PASSWORD) {
        errorHint.classList.remove("show");
        window.location.href = TARGET_URL;
      } else {
        // 錯誤抖動動畫與紅字提示
        accountInput.classList.add("shake");
        passwordInput.classList.add("shake");
        errorHint.classList.add("show");

        setTimeout(() => {
          accountInput.classList.remove("shake");
          passwordInput.classList.remove("shake");
        }, 300);

        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    // 綁定點擊與 Enter 鍵事件
    loginBtn.addEventListener("click", handleLogin);

    [accountInput, passwordInput].forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          handleLogin();
        }
      });
    });
  </script>
</body>
</html>
