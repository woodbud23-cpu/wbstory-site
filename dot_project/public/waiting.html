<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Dice Throne - 配對等待室</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .waiting-box {
      max-width: 480px;
      margin: 80px auto;
      background: #2b2d42;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }
    select {
      width: 100%;
      padding: 10px;
      margin: 20px 0;
      border-radius: 4px;
      background: #181925;
      color: #fff;
      font-size: 1rem;
      border: 1px solid #4a4e69;
    }
    .status-msg {
      margin-top: 15px;
      font-weight: bold;
      color: #f4a261;
    }
  </style>
  <!-- 修正 1：改用 CDN 載入 Socket.io Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="waiting-box">
    <h2>選擇英雄與配對</h2>
    
    <div id="selection-area">
      <label for="hero-select">請選擇你的英雄：</label>
      <select id="hero-select">
        <option value="gunslinger">神射手 (Gunslinger)</option>
        <option value="samurai">武士 (Samurai)</option>
      </select>
      
      <button id="confirm-btn" class="action-btn" style="width: 100%;">確定並開始配對</button>
    </div>

    <div id="status-area" style="display: none;">
      <div class="status-msg" id="status-text">配對中，等待對手選擇英雄...</div>
    </div>
  </div>

  <script>
    const username = sessionStorage.getItem('dt_username');
    if (!username) {
      window.location.href = './login.html';
    }

    const socket = io();
    const heroSelect = document.getElementById('hero-select');
    const confirmBtn = document.getElementById('confirm-btn');
    const selectionArea = document.getElementById('selection-area');
    const statusArea = document.getElementById('status-area');
    const statusText = document.getElementById('status-text');

    // 進入等待室即註冊加入
    socket.emit('join_waiting', { username });

    // 伺服器拒絕加入（如人數已滿）
    socket.on('error_message', (msg) => {
      alert(msg);
      window.location.href = './lobby.html';
    });

    // 實時更新選角清單
    socket.on('hero_selection_update', (selectedHeroes) => {
      Array.from(heroSelect.options).forEach(option => {
        if (selectedHeroes.includes(option.value)) {
          option.disabled = true;
          option.innerText = option.innerText.replace(' (已被選擇)', '') + ' (已被選擇)';
        } else {
          option.disabled = false;
          option.innerText = option.innerText.replace(' (已被選擇)', '');
        }
      });

      const availableOption = Array.from(heroSelect.options).find(opt => !opt.disabled);
      if (availableOption) {
        heroSelect.value = availableOption.value;
      }
    });

    // 送出角色選擇
    confirmBtn.addEventListener('click', () => {
      const selectedHero = heroSelect.value;
      socket.emit('select_hero', { hero: selectedHero });
    });

    // 本身進入等待狀態 UI
    socket.on('waiting_for_opponent', () => {
      selectionArea.style.display = 'none';
      statusArea.style.display = 'block';
    });

    // 收到雙方完成通知，同步轉跳至 game.html
    socket.on('match_start', (data) => {
      statusText.innerText = '配對成功！即將進入遊戲...';
      sessionStorage.setItem('dt_match_info', JSON.stringify(data));

      setTimeout(() => {
        window.location.href = './game.html';
      }, 1000);
    });
  </script>
</body>
</html>
