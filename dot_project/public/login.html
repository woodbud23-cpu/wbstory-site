<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Dice Throne - 登入</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box {
      max-width: 360px;
      margin: 100px auto;
      background: #2b2d42;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #4a4e69;
      background: #181925;
      color: #fff;
      box-sizing: border-box;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>歡迎來到 Dice Throne</h2>
    <form id="login-form">
      <input type="text" id="username-input" placeholder="請輸入帳號 (玩家ID)" required maxlength="12">
      <input type="password" id="password-input" placeholder="請輸入通關密碼" required>
      <div id="error-message" class="error-msg">密碼錯誤，請重新輸入！</div>
      
      <button type="submit" class="action-btn" style="width: 100%; margin-top: 15px;">進入遊戲大廳</button>
    </form>
  </div>

  <script>
    const SECRET_PASSWORD = 'chris'; // 固定通關密碼

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const errorMsg = document.getElementById('error-message');

      // 檢查密碼
      if (password !== SECRET_PASSWORD) {
        errorMsg.style.display = 'block';
        return;
      }

      // 通關成功，隱藏錯誤訊息並儲存 ID
      errorMsg.style.display = 'none';
      sessionStorage.setItem('dt_username', username);
      
      // 轉跳至大廳
      window.location.href = 'lobby.html';
    });
  </script>
</body>
</html>
