<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>終於結束了...</title>
  
  <!-- 引入 Noto Serif TC 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #fdfdfd; /* 白色基底 */
      color: #2b2b2b;
      font-family: "Noto Serif TC", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 背景柔和暖光光暈 */
    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08), transparent 75%);
      pointer-events: none;
    }

    /* 中間對話框容器 (較淺的典雅米灰底色) */
    .message-container {
      max-width: 620px;
      width: 100%;
      background: #f7f5f0;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 48px 36px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 0 25px rgba(212, 175, 55, 0.08);
      position: relative;
      z-index: 1;
    }

    /* 打字文字本體 */
    .typewriter-text {
      font-size: 20px;
      line-height: 2.2;
      color: #2c3038;
      letter-spacing: 1.5px;
      white-space: pre-line;
      min-height: 220px;
      word-break: break-word;
    }

    /* 閃爍游標 */
    .cursor {
      display: inline-block;
      width: 2.5px;
      height: 1.1em;
      background-color: #bfa043;
      vertical-align: -0.15em;
      margin-left: 4px;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 跳轉倒數進度提示 */
    .redirect-status {
      margin-top: 28px;
      font-size: 13px;
      color: #8c929c;
      letter-spacing: 2px;
      text-align: right;
      opacity: 0;
      transition: opacity 0.5s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .redirect-status.show {
      opacity: 1;
    }

    /* 略過按鈕 */
    .skip-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: transparent;
      border: 1px solid rgba(140, 146, 156, 0.4);
      color: #8c929c;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .skip-btn:hover {
      border-color: #bfa043;
      color: #bfa043;
      background: rgba(212, 175, 55, 0.08);
    }

    /* 手機版適配 */
    @media (max-width: 640px) {
      .message-container {
        padding: 32px 24px;
      }
      .typewriter-text {
        font-size: 17px;
        line-height: 2;
        min-height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <main class="message-container">
    <div class="typewriter-text" id="typewriterText"><span class="cursor" id="cursor"></span></div>
    <div class="redirect-status" id="redirectStatus">即將前往木芽故事館首頁...</div>
  </main>

  <button class="skip-btn" id="skipBtn">略過 [SKIP] ➔</button>

  <script>
    const HOME_URL = "https://wbstory.site/"; // 跳轉目標

    const MESSAGE = 
`搞了半天，
原來這一切都是巨龍的詭計啊...
幸好我最後是破了他的真實身分。
真是的，
莫名奇妙的連結，果然不能亂點啊...`;

    const textElement = document.getElementById("typewriterText");
    const cursorElement = document.getElementById("cursor");
    const redirectStatus = document.getElementById("redirectStatus");
    const skipBtn = document.getElementById("skipBtn");

    let currentIndex = 0;

    function redirectToHome() {
      window.location.href = HOME_URL;
    }

    function typeNextCharacter() {
      if (currentIndex < MESSAGE.length) {
        const char = MESSAGE[currentIndex];
        
        const textNode = document.createTextNode(char);
        textElement.insertBefore(textNode, cursorElement);
        currentIndex++;

        let delay = 75;

        if (char === "，" || char === "、") {
          delay = 320;
        } else if (char === "。" || char === "！" || char === "!") {
          delay = 500;
        } else if (char === "\n") {
          delay = 450;
        } else if (char === ".") {
          delay = 180;
        }

        setTimeout(typeNextCharacter, delay);
      } else {
        redirectStatus.classList.add("show");
        setTimeout(redirectToHome, 4500);
      }
    }

    skipBtn.addEventListener("click", redirectToHome);

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(typeNextCharacter, 600);
    });
  </script>
</body>
</html>
