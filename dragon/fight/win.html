<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>冒險成功</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #f7f5f0; /* 米白色基底 */
      color: #2b2b2b;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .result-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .result-img {
      max-width: 380px;
      width: 90%;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.15));
    }

    .result-title {
      font-size: 34px;
      font-weight: 900;
      color: #2a6f97;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .result-text {
      font-size: 18px;
      line-height: 1.8;
      color: #4a4a4a;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    .action-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #2b2d42;
      color: #f7f5f0;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #2b2d42;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .action-btn.primary {
      background-color: #2a6f97;
      border-color: #2a6f97;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .action-btn.primary:hover {
      background-color: #01497c;
      border-color: #01497c;
    }

    .action-btn:not(.primary):hover {
      background-color: #4a4e69;
      border-color: #4a4e69;
    }
  </style>
</head>
<body>

  <div class="result-container">
    <img src="win.png" alt="冒險成功" class="result-img">
    <h1 class="result-title">冒險成功</h1>
    <p class="result-text">
      終於成功打倒了巨龍，<br>
      並且成功逃出了地下城。<br>
      但是，好像原本就距離成功很接近了...<br>
      發出求救訊息的，到底是誰？
    </p>
    <div class="btn-group">
      <a href="https://wbstory.site/" class="action-btn primary">前往木芽故事館</a>
      <a href="https://wbstory.site/dragon/forum/" class="action-btn">回到現實</a>
    </div>
  </div>

</body>
</html>
