<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隊伍全滅</title>

  <!-- 預連線加速跳轉 -->
  <link rel="preconnect" href="https://wbstory.site">
  <link rel="dns-prefetch" href="https://wbstory.site">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #f7f5f0;
      color: #2b2b2b;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .result-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .result-img {
      max-width: 380px;
      width: 90%;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    .result-title {
      font-size: 34px;
      font-weight: 900;
      color: #9e2a2b;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .result-text {
      font-size: 18px;
      line-height: 1.8;
      color: #4a4a4a;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    .action-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #2b2d42;
      color: #f7f5f0;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #2b2d42;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .action-btn:hover {
      background-color: #4a4e69;
      border-color: #4a4e69;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <div class="result-container">
    <img src="bad1.png" alt="隊伍全滅" class="result-img">
    <h1 class="result-title">隊伍全滅</h1>
    <p class="result-text">
      沒想到還是沒能幫上忙...<br>
      巨龍也太強了吧？<br>
      不對，一定是我漏掉了什麼...
    </p>
    <div class="btn-group">
      <a href="index.html" class="action-btn">重新開始</a>
      <a href="https://wbstory.site/dragon/forum/" class="action-btn">回到現實</a>
    </div>
  </div>

</body>
</html>
